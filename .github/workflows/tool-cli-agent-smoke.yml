name: Tool CLI Agent smoke (optional)
on:
  pull_request:
    paths:
      - agent_tools.py
      - tool_cli.py
      - tests/test_tool_cli.py
      - agent_plan.py
      - tests/test_agent_plan.py
      - requirements-python313.txt
      - scripts/check_python_environment.py
      - tests/test_cross_repo_contract.py
      - codemeta.json
      - Makefile
      - docs/02-examples-and-contracts/INTEROPERABILITY_VERIFICATION.md
      - tests/test_runtime_failure_injection.py
      - .github/workflows/tool-cli-agent-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-tool-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install exact-version Python verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-python313.txt
      - name: Verify Python 3.13 environment and emit receipt
        run: python scripts/check_python_environment.py
      - name: Compile tool and test modules
        run: python -m compileall -q agent_tools.py agent_plan.py tool_cli.py tests/test_tool_cli.py tests/test_agent_plan.py
      - name: Test registry, CLI, UI and native tool calls
        run: python -m unittest tests.test_tool_cli -v
      - name: Run complete repository manual test suite
        run: make test
      - name: Generate JSON and offline HTML catalog
        run: |
          python tool_cli.py list > /tmp/tools.json
          python tool_cli.py list --format html --output /tmp/tools.html
          python -c "import json; d=json.load(open('/tmp/tools.json')); assert len(d['result']['tools']) == 2"
          test -s /tmp/tools.html
