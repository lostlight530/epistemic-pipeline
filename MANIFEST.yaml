name: epistemic-pipeline
purpose: evidence-aware state-machine execution for research workflows
calibrated: "2026-08-28"

principles:
  - explicit_state_transition
  - machine_readable_runtime_policy
  - claim_evidence_conflict_separation
  - bounded_heuristic_scores_not_probabilities
  - recovery_identity_before_resume
  - trace_provenance_claim_audit_are_distinct
  - assertion_basis_separate_from_correctness
  - audit_coverage_separate_from_provenance_soundness
  - no_aggregate_research_quality_score
  - explicit_provider_disclosure_basis
  - no_automatic_ai_text_detection
  - provenance_not_truth
  - no_scientific_verdict_from_structure_alone
  - stable_internal_identifiers_without_decorative_versions
  - github_governance_separate_from_research_architecture

stable_profiles:
  engine: epistemic-pipeline/engine
  runtime_policy: epistemic-pipeline/runtime-policy
  trace: epistemic-pipeline/trace
  checkpoint: epistemic-pipeline/checkpoint
  provenance: epistemic-pipeline/prov
  confidence: epistemic-pipeline/confidence-heuristic
  network_input: epistemic-pipeline/network-input
  claim_index: epistemic-pipeline/claim-index
  claim_verification: epistemic-pipeline/claim-verification
  process_disclosure: epistemic-pipeline/process-disclosure
  upstream_reference: epistemic-pipeline/upstream-reference
  evidence_envelope: epistemic-pipeline/evidence-envelope
  reference_rules: epistemic-pipeline/reference-rules

canonical_runtime:
  graph:
    module: core/dependency_graph.py
    status: implemented
    semantics: structural_dag_validation_and_ordering
  engine:
    module: core/engine.py
    status: implemented
  provider_contract:
    module: core/llm_harness.py
    status: implemented
    built_in_real_provider: false
    assertion_basis:
      injected_provider: provider-adapter-reported
      mock_provider: synthetic-fixture-runtime
      no_provider: runtime-harness-state
      basis_inferred: false
      automatic_ai_detection_used: false
    mock_provider:
      mode: synthetic_fixture
      model: null
      version: null
      external_model_call: false
  runtime_policy:
    module: core/gatekeeper.py
    status: implemented
    active_api: RuntimePolicyEvaluator
    compatibility_names: [Gatekeeper, check_quality_gates, quality_gates]
    unknown_check_behavior: fail_explicitly
  confidence_network:
    module: core/confidence_net.py
    status: implemented
    range: "[0,1]"
    semantics: bounded_weighted_heuristic_not_calibrated_probability
    convergence_truth_claim: false
  calibration_transform:
    module: core/calibration.py
    status: implemented_transform
    empirically_fitted_by_repository: false
    probability_calibration_claim: false
  trace:
    module: core/run_tracer.py
    status: implemented
    profile: epistemic-pipeline/trace
    sha256_previous_record_chain: true
    externally_anchored: false
    opentelemetry_exporter: false
  checkpoint:
    module: core/engine.py
    status: implemented
    profile: epistemic-pipeline/checkpoint
    resume_identity: [graph_id, graph_sha256]
  provenance:
    module: core/provenance.py
    status: implemented
    profile: epistemic-pipeline/prov
    alignment: W3C_PROV_concepts
    prov_o_rdf_serializer: false
    full_w3c_serialization_conformance_claim: false
  claim_verification:
    module: core/claim_audit.py
    status: implemented
    profile: epistemic-pipeline/claim-verification
    output_suffix: .claim-audit.json
    payload_text_embedded: false
    audit_states:
      - indexed_only
      - evidence_bound
      - structurally_checked
      - conflict_recorded
      - structurally_checked_with_conflict
    observation_basis:
      claim_and_source_refs: structured-analyze-output
      evidence_refs: structured-analyze-output
      consistency: structured-verify-output
      conflicts: structured-verify-output
      heuristic_scores: structured-state-output
      basis_inferred: false
    audit_coverage:
      denominator: claims_indexed
      dimensions:
        - claims_with_source_refs
        - claims_with_evidence_refs
        - claims_with_internal_consistency_observation
        - claims_with_cross_source_observation
        - claims_with_conflicts
        - claims_with_initial_heuristic_score
        - claims_with_final_heuristic_score
      aggregate_score: null
      provenance_soundness_claim: false
      scientific_validity_claim: false
      probability_claim: false
    scientific_verdict_labels: false
    truth_claim: false
  evidence_envelope:
    module: core/evidence_envelope.py
    status: implemented
    profile: epistemic-pipeline/evidence-envelope
    references:
      - graph
      - trace
      - checkpoint
      - provenance
      - claim_index
      - claim_verification
      - process_disclosure
      - upstream_artifacts
      - upstream_evidence
    local_reference_hashing: sha256_when_file_exists
    network_dereference: false
    upstream_reference_coverage:
      dimensions: [reference_count, by_resolution, local_file_ratio]
      aggregate_score: null
      source_credibility_claim: false
      evidence_quality_claim: false
  run_bundle:
    module: core/run_bundle.py
    status: implemented
    outputs: [provenance, claim_audit, evidence_envelope]
    upstream_reference_iterables_materialized_once: true

claim_verification_semantics:
  evidence_binding: declared_relationship_not_sufficiency
  structural_observation: runtime_or_provider_observation_not_truth
  conflict: disagreement_or_limitation_not_automatic_adjudication
  initial_score: verify_stage_heuristic_observation
  final_score: synthesize_stage_heuristic_observation
  assertion_basis_is_correctness: false
  audit_coverage_is_provenance_soundness: false
  audit_coverage_is_probability: false
  probability_calibration_claim: false
  human_review_peer_review_equivalence: false

interoperability:
  upstream_auto_doc:
    preferred_profile: auto-doc-engine/artifact-record
    direct_runtime_coupling: false
  downstream_sci_render:
    preferred_profiles:
      - sci-render-kit/figure-claim-audit
      - sci-render-kit/figure-evidence
    direct_runtime_coupling: false
  open_telemetry_genai:
    status: scoped_naming_alignment_only
    reused_name: gen_ai.operation.name
    exporter_implementation: false
    conversation_id_mapping_claim: false
  w3c_prov:
    status: concept_alignment
    prov_o_rdf: false

reproducibility_levels:
  R0: traceable
  R1: replay_addressable
  R2: environment_bounded
  R3: separate_rerun_plus_declared_comparison
  automatic_r3_claim: false

not_integrated:
  - built_in_production_llm_provider
  - provenance_soundness_validator
  - automatic_citation_content_verification
  - automatic_ai_text_detection
  - scientific_review_authority
  - peer_review_engine
  - prov_o_rdf_serializer
  - tamper_proof_external_ledger

experimental_modules:
  anti_entropy:
    path: core/anti_entropy.py
    semantics: normalized_shannon_entropy_indicator_window
    physical_entropy_claim: false
  convergence:
    path: core/convergence.py
    semantics: bounded_momentum_score_tracker
    bayesian_belief_claim: false
  infinite_regression:
    path: core/infinite_regression.py
    status: experimental
  neuro_symbolic:
    path: core/neuro_symbolic.py
    status: experimental
  perception:
    path: core/perception.py
    status: experimental
  thread_collapse:
    path: core/thread_collapse.py
    status: experimental

research_contract:
  file: RESEARCH_CONTRACT.md
  claim_audit_contract: CLAIM_AUDIT_CONTRACT.md
  assertion_basis_audit_coverage: ASSERTION_BASIS_AND_AUDIT_COVERAGE.md
  five_day_consolidation: FIVE_DAY_CONSOLIDATION.md
  frontier_alignment: FRONTIER_ALIGNMENT.md

external_research_calibration_2026_08:
  - provenance_grounds_trust_in_autonomous_science
  - responsible_transparent_ai_scientific_publishing
  - artifact_centered_claim_aware_observability
  - trajectories_to_evidence
  - brain_researcher
  - earthverse
  - claim_level_auditability_provenance_coverage
  - ai_detection_distinct_from_disclosure
  note: design_calibration_only_not_external_certification

research_software:
  citation: CITATION.cff
  cff_version: "1.2.0"

local_checks:
  mode: manual_optional
  tests_required_for_2026_08_28_consolidation: false
  github_actions: false
  codeql_added: false
  merge_gate: false

scientific_boundaries:
  provenance_is_truth: false
  assertion_basis_is_correctness: false
  audit_coverage_is_quality: false
  coverage_ratio_is_probability: false
  provenance_soundness_claimed: false
  run_success_is_scientific_validity: false
  runtime_policy_pass_is_scientific_validity: false
  claim_index_is_truth_graph: false
  claim_verification_is_scientific_verdict: false
  heuristic_score_is_probability: false
  convergence_is_certainty: false
  provider_identity_is_output_validity: false
  human_review_is_peer_review: false
  metadata_is_reproduction: false
