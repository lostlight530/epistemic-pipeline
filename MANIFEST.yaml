name: epistemic-pipeline
purpose: 状态机驱动、可门控、可恢复、可追踪、可溯源的科研认知执行系统 | State-machine-driven research execution with gates, recovery, traces, and provenance

principles:
  - 状态机优先: discover -> analyze -> verify -> synthesize -> archive 是规范认知状态
  - DAG执行: 线性与并行由依赖图计算，不靠固定 Agent 顺序
  - 契约先行: Provider 输出结构与 Gatekeeper 消费字段必须一致
  - 失败显式: 质量门失败、永久错误、跨图续跑与未接入能力必须 fail-closed
  - 可恢复: 成功节点写入检查点，续跑只复用已成功状态
  - 可观测: 项目 JSONL 轨迹复用适用的 OTel GenAI Development 字段名，但不冒充完整 OTel SDK/span 实现
  - 可溯源: audited run bundle 使用 W3C PROV 核心语义记录图、节点输出、trace/checkpoint 的哈希谱系
  - 内容最小暴露: provenance 默认记录哈希和结构元数据，不复制研究 payload
  - 科学边界: 结构化输出、数值收敛、通过 gate、hash chain 均不等于科学真值或概率校准

research_contract:
  file: RESEARCH_CONTRACT.md
  status: active
  evidence_unit_fields:
    - claim_id
    - source_refs
    - evidence_refs
    - state_id
    - run_id
    - confidence_value
    - confidence_semantics
    - validation_status
    - trace_ref
  local_reproducibility_levels: [R0, R1, R2, R3]
  note: local project terminology; R3 requires an independent rerun and declared comparison criterion

interoperability_targets:
  prov:
    status: implemented_profile
    profile: epistemic-pipeline/prov@1
    model: W3C-PROV-aligned-JSON
    rdf_serializer: false
  ro_crate:
    status: proposed
    version: "1.3"
    published: "2026-06-22"
    note: no trace/checkpoint/provenance file is called an RO-Crate without exporter + validation tests

states: [discover, analyze, verify, synthesize, archive]

roles:
  implemented: [explorer, analyst, verifier, synthesizer, auditor]
  binding: dynamic-per-state

graphs:
  executable: [linear, parallel, diamond]
  experimental: [adaptive]

execution_chain:
  - role_binding
  - llm_harness
  - gatekeeper
  - confidence_network_at_synthesize
  - checkpoint
  - trace

llm:
  provider_protocol: LLMProvider.complete(system, user, schema) -> dict
  default_mode: deterministic_mock
  real_provider_builtin: false

confidence:
  range: [0.0, 1.0]
  semantics: heuristic propagation values in mock mode, not calibrated probabilities
  convergence: iterative numerical threshold, not scientific certainty
  optional_calibration: temperature_scaling_hook

reliability:
  retry: transient_errors_with_exponential_backoff_and_jitter
  permanent_error: fail_fast
  timeout: caller_timeout_does_not_kill_underlying_thread
  checkpoint_dir: checkpoints/
  resume: successful_nodes_only_same_graph

observability:
  trace_dir: traces/
  format: project-jsonl
  integrity: sha256-prev-hash-chain
  otel_genai:
    status: naming-alignment-only
    convention_status: Development
    sdk_dependency: false
    run_id_semantics: project-local-correlation-id

provenance:
  profile: epistemic-pipeline/prov@1
  entrypoint: python core/run_bundle.py <graph>
  output_dir: provenance/
  model: W3C-PROV-aligned-JSON
  prov_namespace: http://www.w3.org/ns/prov#
  core_terms: [Entity, Activity, Agent, used, wasGeneratedBy, wasDerivedFrom, wasAssociatedWith]
  rdf_serializer: false
  payloads_embedded_by_default: false
  hashing: canonical-sha256

validators:
  - confidence.schema.yaml
  - epistemic.rules.yaml

research_software:
  citation: CITATION.cff
  cff_version: "1.2.0"

verification:
  local_contract: make test
  github_actions: .github/workflows/ci.yml
  python: "3.12"
  dependencies: [pyyaml, numpy]

experimental_modules:
  - anti_entropy
  - convergence
  - infinite_regression
  - neuro_symbolic
  - perception
  - thread_collapse
