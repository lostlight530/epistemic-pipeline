id: diamond
name: 菱形流水线
description: "discover/analyze 后三个 verify 节点按依赖层并发执行，再聚合到 synthesize 与 archive"

type: directed-acyclic-graph
status: executable
nodes:
  - id: discover
    stage: discover
    dependencies: []
  - id: analyze
    stage: analyze
    dependencies: [discover]
  - id: verify_group_1
    stage: verify
    dependencies: [analyze]
    group: 1
  - id: verify_group_2
    stage: verify
    dependencies: [analyze]
    group: 2
  - id: verify_group_3
    stage: verify
    dependencies: [analyze]
    group: 3
  - id: synthesize
    stage: synthesize
    dependencies: [verify_group_1, verify_group_2, verify_group_3]
  - id: archive
    stage: archive
    dependencies: [synthesize]

execution:
  scheduler: dependency_levels
  expected_parallel_layer: [verify_group_1, verify_group_2, verify_group_3]
  expected_max_parallelism: 3
  failure_behavior: "collect completed sibling results, stop downstream execution on group failure, persist checkpoint evidence"
  rollback_completed_nodes: false
  external_side_effect_rollback: false

identity:
  human: id
  executable: canonical_graph_sha256_at_runtime

use_case: "需要对同一分析结果形成多个并行验证记录再综合时的 DAG 结构"
