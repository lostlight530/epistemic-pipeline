id: linear
name: 线性流水线
description: "5 个规范状态按依赖顺序串行执行"

type: directed-acyclic-graph
status: executable
nodes:
  - id: discover
    stage: discover
    dependencies: []
  - id: analyze
    stage: analyze
    dependencies: [discover]
  - id: verify
    stage: verify
    dependencies: [analyze]
  - id: synthesize
    stage: synthesize
    dependencies: [verify]
  - id: archive
    stage: archive
    dependencies: [synthesize]

execution:
  scheduler: dependency_levels
  expected_max_parallelism: 1
  failure_behavior: "stop after failed node/group and persist available checkpoint evidence"
  rollback_completed_nodes: false
  external_side_effect_rollback: false

identity:
  human: id
  executable: canonical_graph_sha256_at_runtime

use_case: "需要简单、可解释依赖顺序的研究运行"
