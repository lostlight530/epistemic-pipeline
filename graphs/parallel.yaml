id: parallel
name: 并行分组流水线
description: "discover 后三个 analyze 节点按依赖层并发执行，再进入 verify / synthesize / archive"

type: directed-acyclic-graph
status: executable
nodes:
  - id: discover
    stage: discover
    dependencies: []
  - id: analyze_group_1
    stage: analyze
    dependencies: [discover]
    group: 1
  - id: analyze_group_2
    stage: analyze
    dependencies: [discover]
    group: 2
  - id: analyze_group_3
    stage: analyze
    dependencies: [discover]
    group: 3
  - id: verify
    stage: verify
    dependencies: [analyze_group_1, analyze_group_2, analyze_group_3]
  - id: synthesize
    stage: synthesize
    dependencies: [verify]
  - id: archive
    stage: archive
    dependencies: [synthesize]

execution:
  scheduler: dependency_levels
  expected_parallel_layer: [analyze_group_1, analyze_group_2, analyze_group_3]
  expected_max_parallelism: 3
  failure_behavior: "collect completed sibling results, stop downstream execution on group failure, persist checkpoint evidence"
  rollback_completed_nodes: false
  external_side_effect_rollback: false

identity:
  human: id
  executable: canonical_graph_sha256_at_runtime

use_case: "研究材料可以分成多个独立分析分支时的并行结构"
