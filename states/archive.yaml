id: archive
name: 归档阶段
description: >
  研究运行产物封装阶段。目标是形成 artifact / provenance / metadata / audit 记录，
  便于后续检查与重放定位；归档存在本身不等于独立复现、真值确认或外部标准认证。

entry_condition: "synthesize 已输出 synthesis_report"
exit_condition: "artifact_bundle / provenance_chain / metadata_package 结构存在"

activities:
  - name: 产物收集
    description: "收集当前运行声明的产物引用"
    output: artifact_bundle
  - name: 溯源记录
    description: "记录输入、节点输出与运行产物之间的 lineage 引用"
    output: provenance_chain
  - name: 元数据封装
    description: "生成机器可读 metadata package 并声明内容语义"
    output: metadata_package
  - name: 运行审计摘要
    description: "记录本次运行结构状态，不等于科学同行评审"
    output: audit_report

role_bindings:
  primary: auditor
  secondary: synthesizer

transitions:
  - to: null
    condition: "归档结构完成，运行结束"

runtime_policies:
  - id: artifact_complete
    name: "产物引用存在"
    rule: "artifact_bundle 非空"
    check: non_empty
    field: artifact_bundle
  - id: provenance_present
    name: "溯源结构存在"
    rule: "provenance_chain 非空；本规则不声称链内容已被外部验证"
    check: non_empty
    field: provenance_chain
  - id: metadata_valid
    name: "元数据结构完整"
    rule: "metadata_package 声明 profile/generated_by/content_semantics"
    check: mapping_required_keys
    field: metadata_package
    required_keys: [profile, generated_by, content_semantics]
