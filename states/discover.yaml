id: discover
name: 发现阶段
description: >
  信息收集与来源登记阶段。目标是建立可追踪来源与原始提取记录；
  本阶段不判断来源真伪或科学结论，只要求声明的采集结构完整。

entry_condition: "输入数据已就绪"
exit_condition: "至少一个来源已登记，提取项带来源和元数据"

activities:
  - name: 来源扫描
    description: "建立来源清单"
    output: sources_index
  - name: 内容提取
    description: "从来源中记录原始提取项"
    output: raw_extractions
  - name: 元数据标注
    description: "为提取项保留来源与结构元数据"
    output: annotated_corpus

role_bindings:
  primary: explorer
  secondary: analyst

transitions:
  - to: analyze
    condition: "sources_index 非空且 raw_extractions 元数据结构完整"
  - to: discover
    condition: "发现来源缺口，需要补充采集"

# Historical key retained for engine/API compatibility. `check` and parameters
# are the executable runtime-policy definition; `rule` is human-readable text.
quality_gates:
  - id: coverage
    name: "来源存在"
    rule: "sources_index 至少包含 1 个来源"
    check: min_items
    field: sources_index
    min: 1
  - id: metadata_completeness
    name: "提取项元数据完整"
    rule: "每个 raw_extractions 条目包含 source_id 与 metadata"
    check: every_item_fields
    field: raw_extractions
    required_fields: [source_id, metadata]
    require_non_empty: true
