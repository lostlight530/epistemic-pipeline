id: verify
name: 验证阶段
description: >
  交叉检查与冲突记录阶段。目标是记录一致性、跨来源比较、冲突和初始启发式分值。
  本阶段的 coverage / confidence_seed 是流水线内部结构信号，不等于科学验证完成或校准概率。

entry_condition: "analyze 已输出 entity_map + claims_registry + evidence_chains"
exit_condition: "coverage 达到声明阈值，冲突结构完整，confidence_seed 非空"

activities:
  - name: 内部一致性检查
    description: "记录同一来源内部的一致性观察"
    output: internal_consistency_report
  - name: 跨来源比较
    description: "记录不同来源之间的对照结果"
    output: cross_source_matrix
  - name: 冲突记录
    description: "记录关系类型与严重程度"
    output: conflict_registry
  - name: 初始分值
    description: "为已处理 claim_id 提供 [0,1] 内启发式初始值"
    output: confidence_seed

role_bindings:
  primary: verifier
  secondary: auditor

transitions:
  - to: synthesize
    condition: "运行时结构规则通过"
  - to: analyze
    condition: "结构或冲突记录需要重新分析"
  - to: discover
    condition: "需要补充来源"

runtime_policies:
  - id: verification_coverage
    name: "处理覆盖"
    rule: "coverage >= 0.95"
    check: numeric_min
    field: coverage
    min: 0.95
  - id: conflict_documented
    name: "冲突结构完整"
    rule: "每个 conflict_registry 条目包含 relation 与 severity；无冲突时空列表允许"
    check: conflicts_have_fields
    field: conflict_registry
    required_fields: [relation, severity]
  - id: confidence_assigned
    name: "初始分值存在"
    rule: "confidence_seed 非空"
    check: non_empty
    field: confidence_seed
