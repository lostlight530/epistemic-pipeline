title: "Epistemic Runtime Reference Rules"
profile: epistemic-pipeline/reference-rules
description: >
  仓库级参考规则地图。这个文件不是通用 policy interpreter；
  只有明确写入对应模块/state check 的规则才真正执行。

enforcement_model: explicit_module_or_state_check_only

rules:
  - id: dependency_graph_acyclic
    severity: error
    description: "可执行 graph 不允许循环依赖"
    enforced_by: core/dependency_graph.py
    semantics: structural_graph_validity

  - id: dependency_exists
    severity: error
    description: "节点声明的 dependency 必须指向 graph 内已定义节点"
    enforced_by: core/dependency_graph.py
    semantics: structural_graph_validity

  - id: node_id_unique
    severity: error
    description: "graph node id 必须唯一"
    enforced_by: core/dependency_graph.py
    semantics: structural_graph_identity

  - id: all_nodes_reachable
    severity: error
    description: "可执行节点应从至少一个 root 节点可达"
    enforced_by: core/dependency_graph.py
    semantics: structural_graph_reachability

  - id: state_runtime_policy_explicit
    severity: error
    description: "state runtime_policies 中每条 active policy 必须使用 RuntimePolicyEvaluator 支持的 machine-readable check"
    enforced_by: core/gatekeeper.py
    semantics: runtime_output_predicate

  - id: provider_returns_mapping
    severity: error
    description: "LLMProvider.complete 必须返回结构化 dict"
    enforced_by: core/llm_harness.py
    semantics: provider_contract

  - id: score_range
    severity: error
    description: "启发式 claim score 必须在 [0,1] 范围内"
    enforced_by: core/confidence_net.py
    semantics: bounded_numeric_score_not_probability

  - id: score_convergence_scope
    severity: info
    description: "converged 只描述数值更新 delta 达到 threshold，不等于真值或科学确定性"
    enforced_by: documentation_and_output_profile
    semantics: scientific_integrity_boundary

  - id: checkpoint_graph_identity
    severity: error
    description: "resume 必须同时匹配 graph_id 与 canonical graph_sha256"
    enforced_by: core/engine.py
    semantics: recovery_identity_boundary

  - id: trace_correlation_scope
    severity: error
    description: "项目 run_id 使用 epistemic.run.id，不冒充 provider gen_ai.conversation.id"
    enforced_by: core/run_tracer.py
    semantics: observability_identity_boundary

  - id: trace_integrity_scope
    severity: info
    description: "prev_hash chain 只证明当前存在记录的内部顺序/hash 一致性，没有外部锚点时不称 tamper-proof"
    enforced_by: core/run_tracer.py
    semantics: integrity_boundary

  - id: provenance_profile_scope
    severity: info
    description: "PROV-aligned JSON 不是 PROV-O RDF serializer，也不声明完整 W3C PROV serialization conformance"
    enforced_by: core/provenance.py
    semantics: interoperability_boundary

  - id: evidence_envelope_scope
    severity: info
    description: "evidence envelope 是项目 handoff profile，不是外部标准"
    enforced_by: core/evidence_envelope.py
    semantics: cross_repository_handoff

  - id: claim_verification_scope
    severity: info
    description: "claim verification 记录结构观察、证据绑定与冲突，不产生 verified=true 或科学真值标签"
    enforced_by: core/claim_audit.py
    semantics: claim_audit_boundary

  - id: scientific_validity_not_inferred
    severity: error
    description: "结构通过、数值收敛、hash/provenance 存在均不得自动升级成科学真值或独立复现"
    enforced_by: research_contract_and_output_profiles
    semantics: scientific_integrity_boundary
